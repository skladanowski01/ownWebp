<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo - Strona Główna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nawigacja -->
    <header>
        <a href="#" class="logo" id="logoLink">Pablo</a>
        <button class="menu-btn" id="menuToggle">Menu</button>
    </header>

    <!-- Rozsuwane Menu -->
    <nav class="fullscreen-menu" id="fullscreenMenu">
        <ul class="menu-links">
            <li><a href="#" class="menu-item">About</a></li>
            <li><a href="#" class="menu-item">Services</a></li>
            <li><a href="#" class="menu-item">Contact</a></li>
        </ul>
    </nav>

    <!-- Sekcja Hero (Wideo w tle + Tekst na wierzchu) -->
    <section class="hero">
        <div class="video-bg">
            <video autoplay muted loop playsinline>
                <source src="assets/video/world.mp4" type="video/mp4">
            </video>
        </div>
        <div class="hero-content" id="heroBox">
            <h1>
                Dbałość o wyszukiwanie w Google.<br>
                Strony pod różne ekrany.<br>
                Technologia animacyjna GSAP.
            </h1>
            <p class="h1__description">
                Świat napędza technologia.
            </p>
        </div>
    </section>

    <section class="hero" style="background: #151515; height: 100vh;">
        <h1>Kolejna sekcja (przewiń w dół)</h1>
    </section>

    <!-- GSAP z CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
